# megalint.conf — scoring & threshold configuration
# All values are bash-sourceable. Edit freely.

# ─── Pillar weights (must sum to 100) ─────────────────────────
# When a tool is skipped, its weight redistributes proportionally.
WEIGHT_STRUCTURE=25     # AgentLinter   — workspace structure, clarity, rules
WEIGHT_QUALITY=18       # PromptLint    — per-file clarity (0-10 scaled to 0-100)
WEIGHT_CONSISTENCY=22   # Home-Grow     — cross-agent consistency checks
WEIGHT_SECURITY=20      # Prompt Hardener — LLM-powered injection testing
WEIGHT_BUDGET=15        # Token Budget  — per-file length vs budget scoring

# ─── Thresholds ───────────────────────────────────────────────
PASS_THRESHOLD=70       # minimum score to pass (0-100)
BLOCKING_ERRORS=true    # if true, any Home-Grow ERROR = fail regardless of score

# ─── Grade scale ──────────────────────────────────────────────
# Score >= threshold gets that grade. Evaluated top-down.
# Standard 10-point scale with ~3-point sub-divisions.
# Pass threshold (70) aligns with C- boundary so no "C+ but FAIL" confusion.
GRADE_S=97
GRADE_A_PLUS=95
GRADE_A=93
GRADE_A_MINUS=90
GRADE_B_PLUS=87
GRADE_B=83
GRADE_B_MINUS=80
GRADE_C_PLUS=77
GRADE_C=73
GRADE_C_MINUS=70
GRADE_D=60
# Below GRADE_D = F
