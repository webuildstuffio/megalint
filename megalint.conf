# megalint.conf — scoring & threshold configuration
# All values are bash-sourceable. Edit freely.

# ─── Pillar weights (must sum to 100) ─────────────────────────
# When a tool is skipped, its weight redistributes proportionally.
# Security is non-negotiable even for a private system (secrets, injection,
# permissions). Consistency anchors multi-agent coherence.
WEIGHT_STRUCTURE=28     # AgentLinter   — workspace structure, clarity, rules
WEIGHT_QUALITY=20       # PromptLint    — per-file clarity, security, cost
WEIGHT_CONSISTENCY=27   # Home-Grow     — cross-agent consistency checks
WEIGHT_SECURITY=25      # Prompt Hardener — LLM-powered injection testing

# ─── Thresholds ───────────────────────────────────────────────
PASS_THRESHOLD=70       # minimum score to pass (0-100)
BLOCKING_ERRORS=true    # if true, any Home-Grow ERROR = fail regardless of score

# ─── Grade scale ──────────────────────────────────────────────
# Score >= threshold gets that grade. Evaluated top-down.
GRADE_S=98
GRADE_A_PLUS=96
GRADE_A=93
GRADE_A_MINUS=90
GRADE_B_PLUS=85
GRADE_B=80
GRADE_B_MINUS=75
GRADE_C_PLUS=68
GRADE_C=60
GRADE_C_MINUS=55
GRADE_D=50
# Below GRADE_D = F
