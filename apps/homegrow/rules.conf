# homegrow/rules.conf — Check configuration for OpenClaw Home-Grow linter
# Set to 0 to disable a check, 1 to enable. All enabled by default.

# ─── Structure checks ────────────────────────────────────────────────────────
CHECK_SHARED_FILES=1          # _shared/ files exist
CHECK_REQUIRED_FILES=1        # 8 required files per agent
CHECK_BOOT_REFS=1             # BOOT.md references _shared/ files
CHECK_BOOT_STRUCTURE=1        # BOOT.md has Standard section + checklist
CHECK_ROSTER_COUNT=1          # AGENT_ROSTER.md count matches dirs
CHECK_BOOTSTRAP_CLEANUP=1     # No stale BOOTSTRAP.md

# ─── Convention checks ───────────────────────────────────────────────────────
CHECK_ANTI_SYCOPHANCY=1       # SOUL.md opens with anti-sycophancy line
CHECK_ACTION_TIERS=1          # AGENTS.md has Action Tiers with Always + Never
CHECK_TONE_TABLE=1            # SOUL.md has tone calibration table
CHECK_CONTINUITY_LINE=1       # SOUL.md has continuity/memory line
CHECK_SECURITY_SECTION=1      # AGENTS.md has security section/reference
CHECK_MEMORY_WORKFLOW=1       # AGENTS.md references memory workflow
CHECK_HEARTBEAT=1             # HEARTBEAT.md contract validation
CHECK_TOKEN_BUDGETS=1         # Per-file token budget enforcement

# ─── Consistency checks ──────────────────────────────────────────────────────
CHECK_TIMEZONE=1              # USER.md has timezone info
CHECK_CANONICAL_WORDING=1     # Consistent phrasing for sensitive terms

# ─── Token budgets (word count × 1.3 ≈ tokens) ──────────────────────────────
BUDGET_AGENTS_MD=800
BUDGET_SOUL_MD=200
BUDGET_IDENTITY_MD=80
BUDGET_USER_MD=350
BUDGET_TOOLS_MD=200
BUDGET_HEARTBEAT_MD=100
BUDGET_MEMORY_MD=500

# ─── Behavioral checks (from industry audit) ────────────────────────────────
CHECK_ACTION_TIERS_STRICT=1   # AGENTS.md has structured action tier headings (ERROR)
CHECK_CONVENTIONS_RESOURCEFULNESS=1 # _shared/CONVENTIONS.md has "figure it out" directive
CHECK_BOOT_CONVENTIONS_REF=1  # BOOT.md references CONVENTIONS.md
CHECK_MEMORY_SURFACING=1      # MEMORY_WORKFLOW.md has natural surfacing guidance
CHECK_SOUL_TONE_CALIBRATED=1  # SOUL.md has calibrated tone signal
