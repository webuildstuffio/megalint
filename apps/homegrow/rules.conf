# homegrow/rules.conf — Check configuration for OpenClaw Home-Grow linter
# Set to 0 to disable a check, 1 to enable. All enabled by default.
#
# Override priority: env vars > rules.conf > defaults in run.sh
# Env vars:  MEGALINT_BUDGET_AGENTS_MD=1000  MEGALINT_TIER_INFO=1.30

# ─── Structure checks ────────────────────────────────────────────────────────
CHECK_SHARED_FILES=1          # shared/ files exist
CHECK_REQUIRED_FILES=1        # 8 required files per agent
CHECK_BOOT_REFS=1             # BOOT.md references shared/ files
CHECK_BOOT_STRUCTURE=1        # BOOT.md has Standard section + checklist
CHECK_ROSTER_COUNT=1          # AGENT_ROSTER.md count matches dirs
CHECK_BOOTSTRAP_CLEANUP=1     # No stale BOOTSTRAP.md

# ─── Convention checks ───────────────────────────────────────────────────────
CHECK_ANTI_SYCOPHANCY=1       # SOUL.md opens with anti-sycophancy line
CHECK_ACTION_TIERS=1          # AGENTS.md has Action Tiers with Always + Never
CHECK_TONE_TABLE=1            # SOUL.md has tone calibration table
CHECK_CONTINUITY_LINE=1       # SOUL.md has continuity/memory line
CHECK_SECURITY_SECTION=1      # AGENTS.md has security section/reference
CHECK_MEMORY_WORKFLOW=1       # AGENTS.md references memory workflow
CHECK_HEARTBEAT=1             # HEARTBEAT.md contract validation
CHECK_TOKEN_BUDGETS=0         # Disabled — handled by Token Budget pillar (pillar 5) in megalint.sh. Keeping here causes double-counting and false blocking errors.

# ─── Consistency checks ──────────────────────────────────────────────────────
CHECK_TIMEZONE=1              # USER.md has timezone info
CHECK_CANONICAL_WORDING=1     # Consistent phrasing for sensitive terms

# ─── Token budgets (tiktoken cl100k_base) ─────────────────────────────────────
# Base budgets — the 2-tier system below provides headroom before alerting.
# Token budget checks max out at WARN (never blocking ERROR).
# The Token Budget pillar handles graduated scoring independently.
# Override per-file: MEGALINT_BUDGET_AGENTS_MD=1000 ./megalint.sh
BUDGET_AGENTS_MD=1150
BUDGET_SOUL_MD=350
BUDGET_IDENTITY_MD=115
BUDGET_USER_MD=475
BUDGET_TOOLS_MD=350
BUDGET_HEARTBEAT_MD=150
BUDGET_MEMORY_MD=650

# ─── Token budget severity multipliers (applied to base budgets above) ───────
# INFO:  base × 1.25 — heads-up, approaching limit (25% over)
# WARN:  base × 1.50 — over budget, should trim   (50% over)
# Max severity is WARN — token budgets never block. Score penalty comes from
# the Token Budget pillar (100→0 linear scoring per file).
# Override: MEGALINT_TIER_WARN=1.40 ./megalint.sh
TIER_INFO=1.25
TIER_WARN=1.50

# ─── Behavioral checks (from industry audit) ────────────────────────────────
CHECK_ACTION_TIERS_STRICT=1   # AGENTS.md has structured action tier headings (ERROR)
CHECK_CONVENTIONS_RESOURCEFULNESS=1 # shared/CONVENTIONS.md has "figure it out" directive
CHECK_BOOT_CONVENTIONS_REF=1  # BOOT.md references CONVENTIONS.md
CHECK_MEMORY_SURFACING=1      # MEMORY_WORKFLOW.md has natural surfacing guidance
CHECK_SOUL_TONE_CALIBRATED=1  # SOUL.md has calibrated tone signal
